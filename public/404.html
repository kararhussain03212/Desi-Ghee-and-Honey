<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      ;(function () {
        var redirect = '/?redirect=' + encodeURIComponent(location.pathname + location.search + location.hash)
        location.replace(redirect)
      })()
    </script>
  </body>
</html>
